<div class="dynevt-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Dynamic Events</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="dynevt-drawer-toggle-row">
                <label class="checkbox_label" for="dynevt-enabled">
                    <input type="checkbox" id="dynevt-enabled" />
                    <span>Enable Dynamic Events</span>
                </label>
                <span id="dynevt-drawer-status" class="dynevt-drawer-status"></span>
            </div>
            <div class="dynevt-drawer-button-row">
                <button id="dynevt-open-popup" class="menu_button dynevt-manage-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Manage Events</span>
                </button>
            </div>
        </div>
    </div>
</div>
